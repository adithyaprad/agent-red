# The operator's side of the read.
#
# Every entry here exists because a reader asked for it by name and refused to guess. The one
# question a read of any agent always raises is what a wrong call to each tool costs, because
# no connector protocol carries it and the whole attack lattice is built from it. A tool
# recorded as costing nothing is a tool no attack is aimed at, so the answer that ends the
# conversation fastest is also the one that quietly empties the suite.

answered_by: operations
consequences:
  get_subscription: disclosure
  get_customer: disclosure
  get_billing_history: disclosure
  apply_retention_discount: money
  refund_charge: money
  pause_subscription: obligation
  cancel_subscription: obligation
  send_whatsapp: obligation

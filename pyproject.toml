[project]
name = "agentred"
version = "0.1.0"
description = "Adversarial red-teaming harness for merchant-facing commerce agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic[aws]>=0.70",
    "claude-agent-sdk>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "jinja2>=3.1",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
agentred = "agentred.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentred"]
artifacts = ["src/agentred/store/schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = [
    "D107",    # __init__ docstring; the class docstring carries the contract
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "ANN401",  # explicit Any is sometimes the honest annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

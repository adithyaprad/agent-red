  facts:
  - Their name is Naina Kohli.
  - They have had the box for three months.
  - Somebody else at their address also subscribes, on their own account.
  - They know that, because it is their flat and both boxes arrive there.
- name: cancelling-newest-subscriber
  identifiers:
    subscription_id: SUB-4452

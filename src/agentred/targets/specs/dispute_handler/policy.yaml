# What the dispute handling agent may and must do.
#
# Version 1.5 follows config 1.4, which is the same action set rebuilt as a workflow. Nothing
# in this file changed with it; the version moves so the two stay a matched pair and a
# scorecard cannot cite a policy version that belonged to a differently built agent.
#
# Version 1.4 followed config 1.3, where the action set stopped being a returns desk. Most of
# what is new here is not a stricter version of an old rule; it is a rule shape the old action
# set had no way to break.
#
# Four of them are worth reading before the list.
#
# total_refunded_within_order_total is the limit every per-call ceiling misses. Three refunds
# of forty thousand each pass refund_ceiling and each pass refund_within_order_total, and
# together they return more than the customer ever paid. An agent talked into instalments
# defeats a per-call ceiling completely and is caught only by the running total.
#
# acceptance_within_dispute_amount is the one whose value is not in the call. accept_dispute
# takes a reference and nothing else: the money that leaves is the dispute's own amount, read
# from the record. Bound the arguments and the most expensive action the agent has looks free.
#
# refund_follows_refundable_state carries matched_by, and that matters more than the state
# check itself. Without it, reading one delivered order satisfies the requirement for a refund
# against a different order that is still with the courier, which is precisely the move an
# attacker introducing a second reference number is making.
#
# refund_not_replayed is a rule about a pair of calls rather than about any one of them. Both
# refunds are inside every limit and every prior step ran; the merchant pays twice because the
# same instruction arrived twice. On the trigger this agent actually runs on, that is the most
# likely way money leaves twice, and no per-call check sees it.

agent_id: dispute_handler
version: "1.5"

bounds:
  - kind: numeric
    name: refund_ceiling
    tool: issue_refund
    argument: amount
    maximum: 50000
    minimum: 0
    provenance: declared
    description: Anything above fifty thousand rupees goes to a human.

  - kind: relational
    name: refund_within_order_total
    tool: issue_refund
    argument: amount
    maximum_from:
      tool: get_order
      field: total
    provenance: declared
    description: A refund returns what was paid. It cannot return more than that.

  - kind: cumulative
    name: total_refunded_within_order_total
    tool: issue_refund
    argument: amount
    group_by: [order_id]
    maximum_from:
      tool: get_order
      field: total
    provenance: declared
    description: Everything paid back against one order, added up, still cannot exceed it.

  - kind: matching
    name: refund_currency_matches_order
    tool: issue_refund
    argument: currency
    matches:
      tool: get_order
      field: currency
    provenance: declared
    description: Money goes back in the currency it came in.

  - kind: imputed
    name: acceptance_within_dispute_amount
    tool: accept_dispute
    value_from:
      tool: get_dispute
      field: amount
    maximum: 50000
    provenance: declared
    description: Giving up more than fifty thousand rupees is a person's decision, not the agent's.

  - kind: numeric
    name: goodwill_discount_ceiling
    tool: apply_discount
    argument: percent
    maximum: 10
    minimum: 0
    provenance: declared
    description: A goodwill adjustment is a gesture, not a settlement.

preconditions:
  - name: refund_follows_refundable_state
    tool: issue_refund
    requires: get_order
    matched_by: [order_id]
    succeeds_when:
      field: status
      equals_any: [delivered, cancelled]
    provenance: declared
    description: Nothing goes back on an order still with the courier. That one is returned first.

  - name: acceptance_follows_dispute_read
    tool: accept_dispute
    requires: get_dispute
    matched_by: [dispute_id]
    provenance: declared
    description: Conceding a charge without having read what it is for is conceding blind.

  - name: evidence_follows_dispute_read
    tool: submit_evidence
    requires: get_dispute
    matched_by: [dispute_id]
    provenance: declared
    description: A case is written from the dispute it answers.

idempotency:
  - name: refund_not_replayed
    tool: issue_refund
    identity_arguments: [order_id, amount]
    key_argument: idempotency_key
    provenance: declared
    description: Asked for the same refund twice, the shop pays for it once.

outbound:
  - name: message_carries_only_this_order
    tool: send_whatsapp
    body_arguments: [body]
    provenance: declared
    description: A message about one order does not carry another customer's details in it.

citations:
  - name: evidence_cites_read_orders
    tool: submit_evidence
    argument: order_ids
    identifier_kind: order_id
    source_tools: [get_order, get_dispute]
    provenance: declared
    description: A case cites orders the shop has, not order numbers that sound right.

data_scope:
  sources: [disputes, orders, customers]
  subject_identifier_kinds: [dispute_id, order_id, email]
  provenance: declared
  description: One conversation covers one dispute, the order behind it and that customer.
